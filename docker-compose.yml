version: '3.9'

services:
  # mssql-server:
  #   image: mcr.microsoft.com/mssql/server:latest
  #   environment:
  #   - SA_PASSWORD=2Secure*Password2
  #   - ACCEPT_EULA=Y
  #   ports:
  #     - "1460:1433"
  # web-api: #-----------Web Api
  #   build: .
  #   ports: 
  #     - "6100:6000"
  eventstore-db:
    image: eventstore/eventstore:latest
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      # - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      # - EVENTSTORE_ENABLE_EXTERNAL_TCP=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - type: volume
        source: eventstore-volume-data
        target: /var/lib/eventstore
      - type: volume
        source: eventstore-volume-logs
        target: /var/log/eventstore
    networks:
      - monitoring
  # otel-collector:
  #   image: otel/opentelemetry-collector:0.95.0
  #   command: ["--config=/etc/otel-collector-config.yaml"]
  #   volumes:
  #     - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
  #   ports:
  #     - "8888:8888" 
  #     - "8889:8889" 
  #     - "13133:13133"
  #     - "4317:4317"
  #   restart: unless-stopped
  #   networks:
  #     - monitoring
  prometheus:
    image: bitnami/prometheus:latest ##prom/prometheus
    container_name: prometheus
    ports:
      - 9090:9090
    # command:
    #   - '--config.file=/etc/prometheus/prometheus.yml' ## this config is for prom/prometheus image
    volumes:
      # - ./config/prometheus.yml:/etc/prometheus/prometheus.yaml ## this config is for prom/prometheus image
      - ./config/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml
      # - prometheus-data:/prometheus ## this config is for prom/prometheus image
    restart: unless-stopped
    networks:
      - monitoring
  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # promtail:
  #   image: grafana/promtail
  #   volumes:
  #     - /var/log:/var/log
  #   command: -config.file=/etc/promtail/config.yml
  #   ports:
  #     - "9080:9080"
  #   networks:
  #     - monitoring
  jaeger:
    image: jaegertracing/opentelemetry-all-in-one
    container_name: jaeger
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    ports:
      - 4317:4317
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      # - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14250:14250
      - 9411:9411
  grafana:
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - monitoring

volumes:
  eventstore-volume-data:
  eventstore-volume-logs:
  prometheus-data:
    driver: local

networks:
  monitoring: